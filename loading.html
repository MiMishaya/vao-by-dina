<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAO 20 Taona - Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #6d28d9 0%, #db2777 50%, #f97316 100%);
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* Fond plein écran : photo + dégradé, logo "VAO 20 taona" en haut, produits en bas */
    .loading-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .logo-wrap {
      position: absolute;
      top: 6%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
    }
    .logo-img {
      width: 100%;
      max-width: 620px;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.3));
    }

    .products-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
    }
    .products-img {
      width: 100%;
      max-width: 1040px;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.4));
    }

    /* Bloc de chargement, superposé entre le logo et les produits */
    .loading-block {
      position: absolute;
      z-index: 2;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 480px;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.6rem, 2vh, 1rem);
    }

    .loading-text {
      font-size: clamp(18px, 4.5vw, 32px);
      color: #fff;
      font-weight: 300;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      letter-spacing: 1.5px;
      animation: fadeIn 0.8s ease-out backwards;
    }

    .progress-section {
      width: 100%;
      animation: fadeIn 1s ease-out 0.3s backwards;
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(8px, 1.6vw, 12px);
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #fff 0%, #fbbf24 50%, #f97316 100%);
      border-radius: 8px;
      width: 0%;
      animation: progressFill 5s ease-in-out forwards;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 85%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Téléphones : logo plus haut, produits moins larges pour ne pas déborder */
    @media (max-width: 600px) {
      .logo-wrap { top: 8%; }
      .logo-img { max-width: 260px; }
      .products-img { max-width: 420px; }
      .loading-block { top: 44%; }
    }

    /* Mobiles en mode paysage (peu de hauteur) */
    @media (max-height: 480px) and (orientation: landscape) {
      .logo-wrap { top: 4%; }
      .logo-img { max-width: 220px; }
      .products-img { max-width: 340px; }
      .loading-block { top: 48%; max-width: 340px; }
    }
  </style>
</head>
<body>

  <div class="loading-bg">
    <img class="bg-img" src="img/Render element 02/Web project Element 03_002 BG laoding.png" alt="">
    <div class="logo-wrap">
      <img class="logo-img" src="img/Render element 02/Web project Element 03_001 20ans.png" alt="VAO 20 taona">
    </div>
    <div class="products-wrap">
      <img class="products-img" src="img/Render element 02/Web project Element 03_003 PRODUITS.png" alt="Nos produits VAO">
    </div>
  </div>

  <div class="loading-block">
    <div class="loading-text">Nos produits</div>
    <div class="progress-section">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    var redirected = false;
    var params = new URLSearchParams(window.location.search);
    var target = params.get('to') || 'gammes.html';
    function goToIndex() {
      if (redirected) return;
      redirected = true;
      window.location.href = target;
    }
    document.getElementById('progress-bar-fill').addEventListener('animationend', goToIndex);
    setTimeout(goToIndex, 5000);
  </script>

</body>
</html>
