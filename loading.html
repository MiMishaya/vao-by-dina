<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAO 20 Taona - Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #6d28d9 0%, #db2777 50%, #f97316 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      padding-left: max(1.5rem, env(safe-area-inset-left));
      padding-right: max(1.5rem, env(safe-area-inset-right));
    }

    /* Toute la scène (image + chargement) reste groupée : l'image n'est jamais rognée */
    .scene {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-image {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.35));
    }

    .loading-block {
      width: 100%;
      max-width: 480px;
      margin-top: clamp(1rem, 4vh, 2rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.6rem, 2vh, 1rem);
    }

    .loading-text {
      font-size: clamp(18px, 4.5vw, 32px);
      color: #fff;
      font-weight: 300;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      letter-spacing: 1.5px;
      animation: fadeIn 0.8s ease-out backwards;
    }

    .progress-section {
      width: 100%;
      animation: fadeIn 1s ease-out 0.3s backwards;
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(8px, 1.6vw, 12px);
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #fff 0%, #fbbf24 50%, #f97316 100%);
      border-radius: 8px;
      width: 0%;
      animation: progressFill 3s ease-in-out forwards;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 85%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Tablettes (iPad, etc.) */
    @media (max-width: 1024px) {
      .scene {
        max-width: 700px;
      }
    }

    /* Téléphones */
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .loading-block {
        margin-top: 1rem;
        gap: 0.6rem;
      }
    }

    /* Mobiles en mode paysage (peu de hauteur) */
    @media (max-height: 480px) and (orientation: landscape) {
      body {
        align-items: flex-start;
      }

      .scene {
        max-width: 480px;
      }

      .loading-block {
        margin-top: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="scene">
    <img class="hero-image" src="img/Render element 02/Element_002-Loading Product Page.png" alt="VAO 20 taona">

    <div class="loading-block">
      <div class="loading-text">Nos produits</div>
      <div class="progress-section">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var redirected = false;
    function goToIndex() {
      if (redirected) return;
      redirected = true;
      window.location.href = 'index.html';
    }
    document.getElementById('progress-bar-fill').addEventListener('animationend', goToIndex);
    setTimeout(goToIndex, 3500);
  </script>

</body>
</html>
